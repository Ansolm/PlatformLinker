plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
apply from: './../config.gradle'
android {
    namespace 'com.ansolm.platformlinker.example'

    compileSdk = 37

    defaultConfig {
        applicationId "com.ansolm.platformlinker.example"
        minSdk = 21
        targetSdk = 37
        versionCode df.versionCode
        versionName df.versionName
        manifestPlaceholders = [tencent_appid: project.findProperty('tencent_appid') ?: '1234567890']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation dep.coreKtx
    implementation dep.appcompat
    implementation dep.constraintlayout
    implementation project(path: ':core')
    implementation project(path: ':tencent')
}